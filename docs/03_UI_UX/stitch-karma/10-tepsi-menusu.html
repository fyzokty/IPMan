<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPMan - Windows 11 Sistem Tepsisi Menüsü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0d1b2a;
      user-select: none;
    }
    .acrylic-menu {
      background: rgba(246, 248, 250, 0.88);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18), 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .acrylic-taskbar {
      background: rgba(243, 243, 243, 0.82);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }
    .menu-item:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }
    .menu-item:active {
      background-color: rgba(0, 0, 0, 0.08);
    }
    .wallpaper-glow {
      background: radial-gradient(circle at 80% 80%, #1e528e 0%, #15325b 35%, #0b1a2f 75%);
    }
    .font-mono-numbers {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col justify-end items-end relative overflow-hidden bg-slate-900">

  <!-- Desktop Wallpaper (Blurred subtle blue Windows 11 style) -->
  <div class="absolute inset-0 wallpaper-glow pointer-events-none">
    <!-- Abstract subtle Windows 11 petal / ribbon glow in background -->
    <div class="absolute -right-24 bottom-12 w-[650px] h-[650px] bg-blue-500/20 rounded-full blur-3xl"></div>
    <div class="absolute right-48 bottom-40 w-[420px] h-[420px] bg-sky-400/15 rounded-full blur-2xl"></div>
    <div class="absolute right-10 bottom-64 w-[300px] h-[300px] bg-indigo-500/15 rounded-full blur-2xl"></div>
  </div>

  <!-- Tray Context Menu Container (Popped up directly above IPMan icon in tray) -->
  <div class="relative z-20 mb-3 mr-32 w-[284px] acrylic-menu rounded-lg p-1.5 text-[#1f1f1f] text-[13px] leading-tight flex flex-col transition-all">
    
    <!-- Header (Non-clickable) -->
    <div class="px-3 pt-2.5 pb-2">
      <div class="flex items-center gap-2 mb-1">
        <!-- App icon -->
        <div class="w-4 h-4 text-[#0F6CBD] flex items-center justify-center">
          <svg viewBox="0 0 16 16" fill="currentColor" class="w-3.5 h-3.5">
            <path d="M7 2h2v3H7V2zM2 7h3v2H2V7zm9 0h3v2h-3V7zM7 11h2v3H7v-3z"/>
            <path d="M5.5 5.5h5v5h-5z" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="8" cy="8" r="1.5"/>
          </svg>
        </div>
        <span class="font-semibold text-[13.5px] text-gray-900 tracking-tight">IPMan</span>
      </div>
      <!-- Subtitle status with green dot -->
      <div class="flex items-center gap-1.5 text-[11.5px] text-gray-600 font-normal mt-0.5">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0"></span>
        <span class="truncate">Şu an: Ofis · İnternet çalışıyor</span>
      </div>
    </div>

    <!-- Separator -->
    <div class="h-[1px] bg-black/[0.08] my-1 mx-1.5"></div>

    <!-- Section label -->
    <div class="px-3 py-1 text-[11px] font-semibold text-gray-400 uppercase tracking-wider">
      Ayara geç
    </div>

    <!-- Profile Selection Items -->
    <div class="flex flex-col gap-0.5">
      <!-- Checked: Ofis -->
      <button class="menu-item w-full flex items-center gap-2.5 px-3 py-1.5 rounded-[5px] text-left text-gray-900 font-medium cursor-pointer transition-colors">
        <span class="w-4 flex items-center justify-center text-[#0F6CBD] font-bold text-[13px]">
          <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 8.5 6.5 12 13 4.5"></polyline>
          </svg>
        </span>
        <span class="flex-1 text-[13px] text-gray-900 font-semibold">Ofis</span>
        <span class="font-mono-numbers text-[11px] text-gray-500 font-normal">192.168.10.25</span>
      </button>

      <!-- Otomatik -->
      <button class="menu-item w-full flex items-center gap-2.5 px-3 py-1.5 rounded-[5px] text-left text-gray-800 cursor-pointer transition-colors group">
        <span class="w-4 flex items-center justify-center text-transparent">
          <!-- Empty space for radio/check alignment -->
          <span class="w-1.5 h-1.5 rounded-full bg-transparent"></span>
        </span>
        <span class="flex-1 text-[13px] text-gray-800">Otomatik</span>
        <span class="text-[11px] text-gray-400 group-hover:text-gray-500">DHCP</span>
      </button>

      <!-- Saha PLC -->
      <button class="menu-item w-full flex items-center gap-2.5 px-3 py-1.5 rounded-[5px] text-left text-gray-800 cursor-pointer transition-colors group">
        <span class="w-4 flex items-center justify-center text-transparent">
          <span class="w-1.5 h-1.5 rounded-full bg-transparent"></span>
        </span>
        <span class="flex-1 text-[13px] text-gray-800">Saha PLC</span>
        <span class="font-mono-numbers text-[11px] text-gray-400 group-hover:text-gray-500">192.168.0.50</span>
      </button>

      <!-- Kamera kurulumu -->
      <button class="menu-item w-full flex items-center gap-2.5 px-3 py-1.5 rounded-[5px] text-left text-gray-800 cursor-pointer transition-colors group">
        <span class="w-4 flex items-center justify-center text-transparent">
          <span class="w-1.5 h-1.5 rounded-full bg-transparent"></span>
        </span>
        <span class="flex-1 text-[13px] text-gray-800">Kamera kurulumu</span>
        <span class="font-mono-numbers text-[11px] text-gray-400 group-hover:text-gray-500">192.168.1.200</span>
      </button>
    </div>

    <!-- Separator -->
    <div class="h-[1px] bg-black/[0.08] my-1 mx-1.5"></div>

    <!-- Action items -->
    <div class="flex flex-col gap-0.5">
      <button class="menu-item w-full flex items-center gap-2.5 px-3 py-1.5 rounded-[5px] text-left text-gray-800 cursor-pointer transition-colors">
        <span class="w-4 flex items-center justify-center text-gray-600">
          <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 6.5A5.5 5.5 0 1 1 3.8 11.2"></path>
            <polyline points="2.5 2.5 2.5 6.5 6.5 6.5"></polyline>
          </svg>
        </span>
        <span class="text-[13px] text-gray-800">Son değişikliği geri al</span>
      </button>

      <button class="menu-item w-full flex items-center gap-2.5 px-3 py-1.5 rounded-[5px] text-left text-gray-900 font-medium cursor-pointer transition-colors">
        <span class="w-4 flex items-center justify-center text-[#0F6CBD]">
          <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="12" height="10" rx="1.5"></rect>
            <line x1="2" y1="6" x2="14" y2="6"></line>
          </svg>
        </span>
        <span class="text-[13px] text-gray-900 font-semibold">IPMan'i aç</span>
      </button>
    </div>

    <!-- Separator -->
    <div class="h-[1px] bg-black/[0.08] my-1 mx-1.5"></div>

    <!-- Exit item -->
    <div class="flex flex-col">
      <button class="menu-item w-full flex items-center gap-2.5 px-3 py-1.5 rounded-[5px] text-left text-gray-800 cursor-pointer transition-colors hover:text-red-600">
        <span class="w-4 flex items-center justify-center text-gray-500">
          <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2H3.5A1.5 1.5 0 0 0 2 3.5v9A1.5 1.5 0 0 0 3.5 14H6"></path>
            <polyline points="10 11 13 8 10 5"></polyline>
            <line x1="13" y1="8" x2="5" y2="8"></line>
          </svg>
        </span>
        <span class="text-[13px]">Çıkış</span>
      </button>
    </div>

  </div>

  <!-- Windows 11 Taskbar -->
  <div class="w-full h-12 acrylic-taskbar z-30 flex items-center justify-between px-3 select-none">
    
    <!-- Empty space / Left (in Windows 11 desktop, left or center has start menu; here we show desktop right-corner slice) -->
    <div class="flex items-center text-gray-400 text-xs font-medium">
      <span class="text-white/40 text-[11px] tracking-wide font-normal ml-2">Masaüstü (Sağ Alt Köşe)</span>
    </div>

    <!-- System Tray Area (Right corner) -->
    <div class="flex items-center gap-1">
      
      <!-- Hidden icons chevron (Windows 11 tray arrow) -->
      <div class="h-9 w-6 flex items-center justify-center rounded hover:bg-black/[0.05] text-gray-600 transition-colors cursor-pointer">
        <svg class="w-3 h-3" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="4 10 8 6 12 10"></polyline>
        </svg>
      </div>

      <!-- Tray Icons Group -->
      <div class="flex items-center gap-0.5 px-1 py-0.5">

        <!-- IPMan Tray Icon (HIGHLIGHTED / ACTIVE STATE) -->
        <div class="relative h-9 px-2 flex items-center justify-center rounded-md bg-white/90 shadow-sm border border-black/[0.08] text-[#0F6CBD] cursor-pointer" title="IPMan - Şu an: Ofis">
          <svg viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4">
            <path d="M7 2h2v3H7V2zM2 7h3v2H2V7zm9 0h3v2h-3V7zM7 11h2v3H7v-3z"/>
            <path d="M5.5 5.5h5v5h-5z" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="8" cy="8" r="1.5"/>
          </svg>
          <!-- Active micro-indicator dot on tray icon -->
          <span class="absolute bottom-1 w-1 h-1 rounded-full bg-[#0F6CBD]"></span>
        </div>

        <!-- Network icon (Ethernet connected) -->
        <div class="h-9 w-7 flex items-center justify-center rounded hover:bg-black/[0.05] text-gray-700 transition-colors cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="12" height="9" rx="1.5"></rect>
            <line x1="5" y1="14" x2="11" y2="14"></line>
            <line x1="8" y1="12" x2="8" y2="14"></line>
          </svg>
        </div>

        <!-- Volume icon -->
        <div class="h-9 w-7 flex items-center justify-center rounded hover:bg-black/[0.05] text-gray-700 transition-colors cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 16 16" fill="currentColor">
            <path d="M11.536 1.464a.5.5 0 0 1 .708 0A10.97 10.97 0 0 1 15 8a10.97 10.97 0 0 1-2.756 6.536.5.5 0 0 1-.708-.708A9.97 9.97 0 0 0 14 8c0-2.585-.98-4.945-2.464-6.536a.5.5 0 0 1 0-.708z"/>
            <path d="M9.5 4.5a.5.5 0 0 1 .5.5 4.978 4.978 0 0 1-1.464 3.536.5.5 0 0 1-.708-.708A3.978 3.978 0 0 0 9 5a.5.5 0 0 1 .5-.5z"/>
            <path d="M7.125 2.125A.5.5 0 0 0 6.27.77L3.484 4H1.5A1.5 1.5 0 0 0 0 5.5v5A1.5 1.5 0 0 0 1.5 12h1.984l2.786 3.23a.5.5 0 0 0 .855-.355V2.125z"/>
          </svg>
        </div>

      </div>

      <!-- Clock & Date (Windows 11 format: 14:32) -->
      <div class="h-9 px-2 flex flex-col justify-center items-end text-right rounded hover:bg-black/[0.05] text-gray-800 transition-colors cursor-pointer leading-tight">
        <span class="text-[12px] font-medium tracking-tight">14:32</span>
        <span class="text-[10px] text-gray-500 font-normal">24.10.2024</span>
      </div>

      <!-- Notification bell / count -->
      <div class="h-9 w-8 flex items-center justify-center rounded hover:bg-black/[0.05] text-gray-700 transition-colors cursor-pointer">
        <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5.5a4 4 0 1 0-8 0c0 4.5-2 6-2 6h12s-2-1.5-2-6"></path>
          <path d="M6.86 13.5a1.5 1.5 0 0 0 2.28 0"></path>
        </svg>
      </div>

      <!-- Show desktop thin strip button at extreme right edge -->
      <div class="h-9 w-1 border-l border-black/10 ml-0.5"></div>

    </div>

  </div>

</body>
</html>
